# Builds the site at the domain root and uploads dist/ to Hostinger by FTP on every push to main.
# Stays off until the repository variable HOSTINGER_FTP_SERVER is set (Settings > Secrets and
# variables > Actions). Only changed files are sent: the action keeps .ftp-deploy-sync-state.json
# on the server, and files uploaded by hand (e.g. the catalog PDFs) are never deleted.
name: Deploy na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.HOSTINGER_FTP_SERVER != ''
    runs-on: ubuntu-latest
    environment:
      name: hostinger
      url: ${{ vars.SITE_URL || 'https://modaza.com.br' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://modaza.com.br' }}
          PUBLIC_ARQUIVOS_URL: ${{ vars.PUBLIC_ARQUIVOS_URL }}

      - name: Verificar links
        run: npm run verificar

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ vars.HOSTINGER_FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.HOSTINGER_FTP_DIR || './' }}
